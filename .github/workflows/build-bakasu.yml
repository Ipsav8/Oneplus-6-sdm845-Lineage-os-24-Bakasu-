name: Build OnePlus 6 kernel (BakaSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      with_root:
        description: "Add BakaSU + SUSFS (false = plain kernel without root)"
        type: boolean
        default: true
      source_repo:
        description: "Kernel source repo (checked out directly, so no fork sync is needed)"
        type: string
        default: "EdwinMoq/android_kernel_oneplus_sdm845"
      source_branch:
        description: "Kernel branch. Empty = the repo's default branch (lineage-23.2-4.19 at the time of writing)"
        type: string
        default: ""
      source_commit:
        description: "Kernel commit to build. Empty = latest on the branch (the old ROM kernel was 78b1551a71ea)"
        type: string
        default: ""
      bakasu_ref:
        description: "BakaSU commit or branch (5d6d1843 = tested, boots, UAPI 6. 7b65bde0 = newest, matches manager 35262. d5e9e025 = old, UAPI 5)"
        type: string
        default: "5d6d1843"
      performance:
        description: "Performance build: kernel tuning + a separate runtime tweaks module (off = regular tested build)"
        type: boolean
        default: false
      publish_release:
        description: "Also publish the zip as a GitHub Release (public download link)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Resolve source commit
        if: ${{ inputs.source_commit != '' }}
        run: |
          URL="https://api.github.com/repos/${{ inputs.source_repo }}/commits/${{ inputs.source_commit }}"
          SHA=""
          for i in 1 2 3 4 5; do
            SHA=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "$URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])" 2>/dev/null) && [ -n "$SHA" ] && break
            echo "attempt $i failed, retrying in 10s"
            sleep 10
          done
          if [ -z "$SHA" ]; then
            echo "Could not resolve the commit. API answered:"
            curl -s -i -H "Authorization: Bearer ${{ github.token }}" "$URL" | head -15
            exit 1
          fi
          echo "Resolved to $SHA"
          echo "SRC_SHA=$SHA" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ env.SRC_SHA || inputs.source_branch }}
          fetch-depth: 1

      - name: Record what was checked out
        run: |
          echo "SRC_SHA=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
          git log -1 --format='Building kernel source commit %h (%cd): %s' --date=short
          echo "localversion files:"; cat localversion-cip localversion-st 2>/dev/null || true
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev cpio zip curl git python3 device-tree-compiler

      - name: Show compiler
        run: |
          clang --version | head -2
          ld.lld --version | head -1

      - name: Add BakaSU and SUSFS patches
        if: ${{ inputs.with_root }}
        run: |
          set -e
          git clone https://github.com/Baka-SU/BakaSU.git BakaSU
          git -C BakaSU checkout "${{ inputs.bakasu_ref }}"
          echo "BAKASU_SHA=$(git -C BakaSU rev-parse --short=8 HEAD)" >> $GITHUB_ENV
          echo "BAKASU_DESC=$(git -C BakaSU describe --tags --always)" >> $GITHUB_ENV
          echo "BakaSU at: $(git -C BakaSU describe --tags --always)"
          git -C BakaSU log -1 --format='%h %cd %s' --date=short
          # Some BakaSU commits refuse to build until SUSFS catches up. Fail early with a clear message.
          if grep -rn "Please wait susfs update" BakaSU/kernel 2>/dev/null; then
            echo "::error::This BakaSU commit blocks the build until SUSFS catches up. Run again with bakasu_ref = d5e9e025 (last known good)."
            exit 1
          fi
          git clone --depth=1 https://github.com/fabiannabil1/susfs-4.19-nongki.git ../susfs-port
          P=$(ls -d ../susfs-port/patches/*/ | head -1)
          if [ ! -f "$P/0002-susfs-v2.3.0-4.19.patch" ]; then
            echo "::error::SUSFS port layout changed. Patch not found. Contents:"
            ls -R ../susfs-port/patches
            exit 1
          fi
          ln -sfn ../BakaSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          python3 - << 'PYEOF'
          p = "drivers/Kconfig"
          lines = open(p).read().split("\n")
          if not any("kernelsu" in l for l in lines):
              idx = max(i for i, l in enumerate(lines) if l.startswith("endmenu"))
              lines.insert(idx, 'source "drivers/kernelsu/Kconfig"')
              open(p, "w").write("\n".join(lines))
              print("drivers/Kconfig edited")
          else:
              print("drivers/Kconfig already has kernelsu")
          PYEOF
          echo "KernelSU linked:"; ls drivers/kernelsu/ | head -5
          git apply --reject --whitespace=nowarn "$P/0002-susfs-v2.3.0-4.19.patch" || true
          echo "Rejected hunks:"; find . -name '*.rej' | sort
          # Only the 3 known spots are fixed by hand below. Anything else means the kernel source changed.
          UNEXPECTED=$(find . -name '*.rej' | sort | grep -vxE './fs/Makefile.rej|./fs/proc/cmdline.c.rej|./kernel/reboot.c.rej' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::SUSFS patch rejected hunks in files beyond the 3 known ones (kernel source changed). Send me this log."
            for f in $UNEXPECTED; do echo "=== $f"; cat "$f"; done
            exit 1
          fi

      - name: Hand fixes for the 3 rejected spots
        if: ${{ inputs.with_root }}
        run: |
          set -e
          python3 - << 'PYEOF'
          def edit(path, fn):
              s = open(path).read()
              n = fn(s)
              if n is None:
                  print("ALREADY DONE:", path)
                  return
              open(path, "w").write(n)
              print("EDITED:", path)

          def mk(s):
              if "susfs.o" in s:
                  return None
              k = "ifeq ($(CONFIG_BLOCK),y)"
              assert k in s, "fs/Makefile anchor not found"
              return s.replace(k, "obj-$(CONFIG_KSU_SUSFS) += susfs.o\n\n" + k, 1)

          def cl(s):
              if "susfs_spoof_cmdline_or_bootconfig" in s:
                  return None
              inc = "#include <linux/seq_file.h>\n"
              assert inc in s, "cmdline.c include anchor not found"
              s = s.replace(inc, inc + "#include <linux/jump_label.h>\n", 1)
              a = "static char proc_command_line[COMMAND_LINE_SIZE];\n"
              assert a in s, "cmdline.c buffer anchor not found"
              ext = ("\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                     "extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n"
                     "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
                     "#endif\n")
              s = s.replace(a, a + ext, 1)
              b = "\tseq_puts(m, proc_command_line);\n"
              assert b in s, "cmdline.c show anchor not found"
              hook = ("#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                      "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
                      "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n"
                      "\t\treturn 0;\n"
                      "\t}\n"
                      "#endif\n")
              return s.replace(b, hook + b, 1)

          def rb(s):
              if "extern int ksu_handle_sys_reboot" in s:
                  return None
              k = "DEFINE_MUTEX(system_transition_mutex);\n"
              assert k in s, "reboot.c anchor not found"
              ext = ("\n#ifdef CONFIG_KSU_SUSFS\n"
                     "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                     "#endif\n")
              return s.replace(k, k + ext, 1)

          edit("fs/Makefile", mk)
          edit("fs/proc/cmdline.c", cl)
          edit("kernel/reboot.c", rb)
          PYEOF
          find . -name '*.rej' -delete
          find . -name '*.orig' -delete
          test -f fs/susfs.c && echo "fs/susfs.c present"
          ls drivers/kernelsu/ | head -5

      - name: Skip OnePlus 6T (fajita) overlays
        run: |
          python3 - << 'PYEOF'
          import re
          p = "arch/arm64/boot/dts/qcom/Makefile"
          s = open(p).read()
          n, c = re.subn(r"fajita[A-Za-z0-9_.+-]*\.dtbo?", "", s)
          open(p, "w").write(n)
          print("removed fajita entries:", c)
          PYEOF
          grep -n "fajita" arch/arm64/boot/dts/qcom/Makefile || echo "no fajita left in qcom/Makefile"

      - name: Make newer-clang warning flags harmless for clang 14
        run: |
          # New kernel source passes -Wno-cast-function-type-strict (clang 16+). Runner clang is 14 and treats it as an error.
          grep -rlE --include='Makefile*' --include='*.mk' -e 'cast-function-type-strict' . 2>/dev/null | grep -v '^./BakaSU' | xargs -r sed -i 's/-Wno-cast-function-type-strict//g' || true
          grep -rn "cast-function-type-strict" --include='Makefile*' . | head || echo "flag removed"

      - name: Configure
        run: |
          set -eo pipefail
          export ARCH=arm64
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-unknown-warning-option"
          echo "ARGS=$ARGS" >> $GITHUB_ENV
          make $ARGS vendor/sdm845-perf_defconfig 2>&1 | tee build.log
          if [ -f arch/arm64/configs/vendor/enchilada.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/enchilada.config 2>&1 | tee -a build.log
          fi
          printf '# CONFIG_FUSE_BPF is not set\nCONFIG_MSM_VIDC_LEGACY_V4L2=y\n' > extra.fragment
          scripts/kconfig/merge_config.sh -m -O out out/.config extra.fragment 2>&1 | tee -a build.log
          if [ "${{ inputs.with_root }}" = "true" ]; then
            echo "--- susfs.fragment:"; cat ../susfs-port/config/susfs.fragment
            scripts/kconfig/merge_config.sh -m -O out out/.config ../susfs-port/config/susfs.fragment 2>&1 | tee -a build.log
          fi
          if [ "${{ inputs.performance }}" = "true" ]; then
            cat > performance.fragment << 'TEOF'
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_IOSCHED_BFQ=y
          CONFIG_MQ_IOSCHED_KYBER=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_PSI=y
          # CONFIG_SCHED_DEBUG is not set
          # CONFIG_SCHEDSTATS is not set
          # CONFIG_DEBUG_PREEMPT is not set
          TEOF
            sed -i 's/^          //' performance.fragment
            scripts/kconfig/merge_config.sh -m -O out out/.config performance.fragment 2>&1 | tee -a build.log
          fi
          make $ARGS olddefconfig 2>&1 | tee -a build.log
          if [ "${{ inputs.performance }}" = "true" ]; then
            echo "--- performance options that stuck:"
            grep -E "CONFIG_(PSI|TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ|CPU_FREQ_DEFAULT_GOV|IOSCHED_BFQ|MQ_IOSCHED_KYBER|CRYPTO_LZ4|ZRAM)[A-Z_]*[= ]|CONFIG_(SCHED_DEBUG|SCHEDSTATS|DEBUG_PREEMPT)[= ]" out/.config
          fi
          grep -E "CONFIG_FUSE_BPF|CONFIG_MSM_VIDC_LEGACY_V4L2" out/.config
          if [ "${{ inputs.with_root }}" = "true" ]; then
            echo "--- KSU related config:"; grep -E "^CONFIG_KSU" out/.config | head -40
            grep -E "^CONFIG_KSU(_SUSFS)?=y" out/.config || { echo "KSU/SUSFS CONFIG DID NOT STICK:"; grep -i ksu out/.config | head -30; exit 1; }
          fi

      - name: Build
        run: |
          set -eo pipefail
          make -j$(nproc) $ARGS 2>&1 | tee -a build.log

      - name: Show real error
        if: failure()
        run: |
          grep -nE "ERROR:|error:|undefined reference|\*\*\* \[" build.log | head -30 || true
          echo "---- single-thread rerun to expose the first error ----"
          make -j1 $ARGS 2>&1 | grep -E -B3 -A6 "ERROR:|error:|\*\*\* \[" | head -60 || true

      - name: Show kernel version
        run: |
          cat out/include/config/kernel.release
          ls -l out/arch/arm64/boot/

      - name: Sanity check root is built in
        if: ${{ inputs.with_root }}
        run: |
          strings out/vmlinux | grep -m5 -iE "susfs|kernelsu|bakasu" || echo "WARNING: no KSU/SUSFS strings found in vmlinux"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          for f in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f out/arch/arm64/boot/$f ]; then echo "Using $f"; cp out/arch/arm64/boot/$f ak3/; break; fi
          done
          cat > ak3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=OP6 BakaSU + SUSFS kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=enchilada
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF
          if [ "${{ inputs.with_root }}" = "true" ]; then N=OP6-BakaSU-SUSFS-kernel; else N=OP6-baseline-kernel; fi
          if [ "${{ inputs.performance }}" = "true" ]; then N="$N-performance"; fi
          echo "ZIPNAME=$N" >> $GITHUB_ENV
          cd ak3 && zip -r9 ../$N.zip . -x '.git*'

      - name: Build runtime performance module
        if: ${{ inputs.performance }}
        run: |
          mkdir -p perfmod/webroot
          cat > perfmod/module.prop << 'MEOF'
          id=op6_performance
          name=OP6 Performance Tweaks
          version=1.1
          versionCode=2
          author=you
          description=CPU governor timings, RAM/swap and storage read-ahead presets for OnePlus 6, with a small WebUI. Disable or remove to undo.
          MEOF
          cat > perfmod/apply.sh << 'AEOF'
          #!/system/bin/sh
          # Usage: apply.sh balanced|performance|battery|status
          CFG=/data/adb/op6_performance
          P0=/sys/devices/system/cpu/cpufreq/policy0
          P4=/sys/devices/system/cpu/cpufreq/policy4
          w() { [ -w "$1" ] && echo "$2" > "$1"; }
          apply() {
            # args: up_rate_us down_rate_us hispeed_load swappiness vfs_cache_pressure read_ahead_kb
            for p in $P0 $P4; do
              if grep -qw schedutil "$p/scaling_available_governors" 2>/dev/null; then
                w "$p/scaling_governor" schedutil
                w "$p/schedutil/up_rate_limit_us" "$1"
                w "$p/schedutil/down_rate_limit_us" "$2"
                w "$p/schedutil/hispeed_load" "$3"
              fi
            done
            w /proc/sys/vm/swappiness "$4"
            w /proc/sys/vm/vfs_cache_pressure "$5"
            w /proc/sys/vm/page-cluster 0
            for q in /sys/block/sd*/queue/read_ahead_kb; do w "$q" "$6"; done
          }
          rd() { cat "$1" 2>/dev/null || echo "n/a"; }
          case "$1" in
            performance) apply 0 20000 70 60 50 1024 ;;
            battery)     apply 1000 5000 95 100 100 256 ;;
            balanced)    apply 500 10000 85 80 80 512 ;;
            status)
              echo "preset=$(rd $CFG/preset)"
              echo "governor=$(rd $P0/scaling_governor) / $(rd $P4/scaling_governor)"
              echo "up_rate_limit_us=$(rd $P0/schedutil/up_rate_limit_us)"
              echo "down_rate_limit_us=$(rd $P0/schedutil/down_rate_limit_us)"
              echo "hispeed_load=$(rd $P0/schedutil/hispeed_load)"
              echo "swappiness=$(rd /proc/sys/vm/swappiness)"
              echo "vfs_cache_pressure=$(rd /proc/sys/vm/vfs_cache_pressure)"
              echo "read_ahead_kb=$(rd /sys/block/sda/queue/read_ahead_kb)"
              exit 0 ;;
            *) echo "unknown preset"; exit 1 ;;
          esac
          mkdir -p "$CFG"
          echo "$1" > "$CFG/preset"
          echo "applied $1"
          AEOF
          cat > perfmod/service.sh << 'SEOF'
          #!/system/bin/sh
          # Re-applies the saved preset (default: balanced) at every boot. Disable/remove the module to undo.
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 5; done
          sleep 20
          P=$(cat /data/adb/op6_performance/preset 2>/dev/null)
          [ -z "$P" ] && P=balanced
          sh "${0%/*}/apply.sh" "$P"
          SEOF
          cat > perfmod/webroot/index.html << 'HEOF'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>OP6 Performance</title>
          <style>
          :root{--bg:#fff;--fg:#1c1b1f;--card:#f1f1f4;--acc:#3a6ff7}
          @media (prefers-color-scheme: dark){:root{--bg:#121214;--fg:#e6e6ea;--card:#1e1e22;--acc:#7da2ff}}
          body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
          h1{font-size:20px;margin:4px 0 12px}
          .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
          button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px}
          button small{display:block;font-size:12px;opacity:.85}
          pre{white-space:pre-wrap;font-size:13px;margin:0}
          </style></head><body>
          <h1>OP6 Performance</h1>
          <div class="card"><pre id="status">Loading...</pre></div>
          <div class="card">
          <button onclick="setp('balanced')">Balanced<small>default, same as boot default</small></button>
          <button onclick="setp('performance')">Performance<small>faster ramp-up, less swapping, bigger read-ahead</small></button>
          <button onclick="setp('battery')">Battery<small>slower ramp-up, more swapping, smaller read-ahead</small></button>
          </div>
          <div class="card"><pre>The chosen preset is saved and applied again at every boot. To undo everything, disable the module in the manager and reboot.</pre></div>
          <script>
          var DIR='/data/adb/modules/op6_performance';
          function run(cmd){return new Promise(function(res){
            if(typeof ksu==='undefined'){res({code:-1,out:'',err:'Open this page from the root manager (Modules > Open).'});return;}
            var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
            window[cb]=function(code,out,err){delete window[cb];res({code:code,out:out,err:err});};
            ksu.exec(cmd,'{}',cb);
          });}
          function status(){run('sh '+DIR+'/apply.sh status').then(function(r){
            document.getElementById('status').textContent=r.out||r.err||'No answer';
          });}
          function setp(n){run('sh '+DIR+'/apply.sh '+n).then(function(){status();});}
          status();
          </script>
          </body></html>
          HEOF
          chmod 755 perfmod/service.sh perfmod/apply.sh
          (cd perfmod && zip -r9 ../OP6-performance-module.zip .)

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.performance }}
        with:
          name: OP6-performance-module
          path: OP6-performance-module.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}.zip

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KREL=$(cat out/include/config/kernel.release)
          KPREFIX="${KREL%%-perf*}"
          TAG="op6-$(date +%Y%m%d-%H%M)"
          TITLE="OnePlus 6 BakaSU + SUSFS kernel - $(date +'%B %-d') update"
          HASH=$(sha256sum "$ZIPNAME.zip" | cut -d' ' -f1)
          {
            echo "OnePlus 6 (enchilada) kernel for LineageOS 24.0 (Android 17)"
            echo ""
            echo "- Kernel: $KREL"
            echo "- Kernel source: ${{ inputs.source_repo }}, commit ${{ env.SRC_SHA }}"
            if [ "${{ inputs.with_root }}" = "true" ]; then
              echo "- Root: BakaSU (ReSukiSU) $BAKASU_DESC (commit $BAKASU_SHA), with SUSFS v2.3.0"
              echo "- Manager: BakaSU v4.2.0-rc3 (35262) or any BakaSU manager with UAPI 6. Updating the manager alone does not update the driver, so flash this zip again after every ROM update."
            else
              echo "- Plain kernel, no root"
            fi
            if [ "${{ inputs.performance }}" = "true" ]; then echo "- Performance build: BBR + fq_codel, schedutil default, BFQ/Kyber available, scheduler debug off. Optional runtime module (CPU governor timings, RAM/swap and storage read-ahead tweaks) attached; disable it in the manager to undo."; fi
            echo "- SHA256: $HASH"
            echo ""
            echo "Only for a ROM whose kernel version starts with $KPREFIX. Back up your boot image first (Kernel Flasher > Backup). Flash the zip with Kernel Flasher or a custom recovery. Use at your own risk."
            echo ""
            echo "Source and build recipe: this repository, workflow build-bakasu.yml"
          } > notes.md
          ASSETS="$ZIPNAME.zip"; [ -f OP6-performance-module.zip ] && ASSETS="$ASSETS OP6-performance-module.zip"
          gh release create "$TAG" $ASSETS --repo "${{ github.repository }}" --title "$TITLE" --notes-file notes.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-info
          include-hidden-files: true
          path: |
            build.log
            out/.config
          if-no-files-found: ignore
